# 논문용 대시보드 — 캠페인 시계열을 4장 그림에 대응하는 화면으로 본다.
#
# 설계 원칙 (2026-08-03 개정)
#   · **L_max 는 데이터가 아니라 기준선**이다 → 빨간 파선, 채움 없음. 실측(실행 중)만 면으로 채운다.
#     이렇게 해야 «상한에 붙어 평평» 과 «상한을 뚫음» 이 한눈에 갈린다(A1′ 그림의 핵심).
#   · 범례를 표 형식으로 두고 **최대·평균을 함께 표시**한다 → 그림만 보고 수치를 읽을 수 있어
#     본문 표와 대조하기 쉽다.
#   · 상단에 요약 수치 4개를 둔다 → 캡처 한 장으로 회차의 결론이 보인다.
#   · CPU 를 메모리보다 먼저 놓는다. 실측 병목이 CPU 이고 메모리는 조건을 가르지 못했다(HANDOVER 참조).
#
# ※ 패널 1 의 쿼리는 반드시 max() 로 감싼다.
#   비교군·에이블레이션 회차가 컨트롤러를 scale 0→1 로 교체하므로 pod/instance 라벨이 다른
#   시계열이 누적된다. 원시 지표를 그대로 쓰면 범례가 «실행 중, 실행 중, L_max, L_max» 로 중복된다.
#   어느 시점이든 리더는 하나이므로 max() 가 올바른 집계다.
#
# ※ **컨트롤러를 끄는 조건(A0-R·A0-NR·비교군)에서는 패널 1·5 가 비어 있는 것이 정상이다.**
#   그 지표를 생산하는 주체가 꺼져 있기 때문이다. 논문 그림 캡션에 한 줄 명시할 것.
#
# ※ 패널 5(웹훅 지연)는 rate 창이 10분이므로 **측정 창 앞 10분 값은 직전 회차가 섞인다.**
#   수집기는 이 구간을 집계에서 제외한다(resource_collect.py). 그림에서도 앞부분은 읽지 말 것.
#
# 패널이 논문 그림과 대응한다:
#   ① 동시 실행 시계열   → 패널 1·2      ② 자원 시계열 → 패널 3·4
#   ④ 제어 계층 부하     → 패널 5        ⑤ 네임스페이스 메모리 → 패널 6
#
# 캡처 방법: 시간 범위를 각 회차의 측정 창으로 맞춘다.
#   창 값은 `results/<시나리오>/run<N>_resource.json` 의 start/end 에 있다.
#   URL 에 &from=<epoch_ms>&to=<epoch_ms>&kiosk 로 넣고 헤드리스 크롬으로 찍는다.
# ── v2 개정 (2026-08-05) ──────────────────────────────────────────────
# Tier 차원 패널 4개를 더했다. 새 4·5장이 말하는 것을 그대로 그린다.
#   · 대기 깊이를 Tier 별로 쌓아 본다 → 기아와 그 완화가 층으로 보인다
#   · 승격 이벤트(3→2, 2→1)를 따로 그린다 → 에이징 기구의 직접 증거
#   · Tier 별 도착률 대 인가율 → 두 선의 간격이 곧 대기열 증가분이다
#   · 제어 계층 처리율·API 오류
#
# ※ 패널 제목에 $ 를 쓰지 말 것 — Grafana 가 대시보드 변수로 해석해 글자가 사라진다.
# ※ 오류 카운터는 "or vector(0)" 로 감싼다. 오류가 없으면 계열 자체가 없어
#   패널이 비고, «오류 없음» 과 «수집 실패» 가 구분되지 않는다.
# ※ 웹훅 지연이 부하 종료 후 끊기는 것은 정상이다(분위수 미정의).
